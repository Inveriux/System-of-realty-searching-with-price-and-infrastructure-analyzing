name: diploma.backend

services:
  postgres:
    build:
      context: .
      dockerfile: Services/ListingService/db.Dockerfile
    image: listingservice-db:local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: listingservice-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listingservice-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  listingservice:
    build:
      context: .
      dockerfile: Services/ListingService/Dockerfile
    image: diploma.listingservice:0.5
    hostname: listingservice
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSqlConnection: "Host=postgres;Port=5432;Database=listingservice-db;Username=postgres;Password=1234"
      Authentication__DomainJwtAuth__Authority: diploma.com
      Authentication__DomainJwtAuth__Audience: diploma-client
      Authentication__DomainJwtAuth__Key: veryverysecretkeythatshouldbereplacedinproduction

volumes:
  db-data:
