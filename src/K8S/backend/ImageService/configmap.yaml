apiVersion: v1
kind: ConfigMap
metadata:
  name: image-service-config
  namespace: diploma
data:
  SERVICE_NAME: IMAGE_SERVICE
  ENV_ASPNETCORE_URLS: http://+:8080
  ImageKit__PublicKey: ""
  ImageKit__PrivateKey: "private_jg+mI7IpAs9jf8toOXtYYHEQzuw="
  ImageKit__UrlEndpoint: https://ik.imagekit.io/your_imagekit_id
  ImageKit__UploadEndpoint: https://upload.imagekit.io/api/v1/files/upload
  ImageKit__BaseFolder: /diploma
  ImageKit__UseUniqueFileName: "true"
  ImageKit__TimeoutSeconds: "30"
  ImageKit__MaxFileSizeInBytes: "10485760"
  ImageKit__MaxFilesPerRequest: "10"
