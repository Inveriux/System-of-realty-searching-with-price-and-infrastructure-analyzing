apiVersion: v1
kind: ConfigMap
metadata:
  name: overpass-belarus-config
  namespace: diploma
data:
  OVERPASS_MODE: init
  OVERPASS_META: "no"
  OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/belarus-260327.osm.pbf
  OVERPASS_DIFF_URL: https://download.geofabrik.de/europe/belarus-updates/
  OVERPASS_COMPRESSION: gz
  OVERPASS_RULES_LOAD: "20"
  OVERPASS_UPDATE_SLEEP: "3600"
  OVERPASS_STOP_AFTER_INIT: "false"
  OVERPASS_PLANET_PREPROCESS: mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf
  OVERPASS_FASTCGI_PROCESSES: "2"
  OVERPASS_RATE_LIMIT: "4"
  OVERPASS_TIME: "120"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overpass-belarus-pvc
  namespace: diploma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overpass-belarus-deployment
  namespace: diploma
  labels:
    app: overpass-belarus
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: overpass-belarus
  template:
    metadata:
      labels:
        app: overpass-belarus
    spec:
      containers:
        - name: overpass-belarus
          image: wiktorn/overpass-api:0.7.62.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: overpass-belarus-config
          volumeMounts:
            - name: overpass-db
              mountPath: /db
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "3000m"
              memory: "8Gi"
      volumes:
        - name: overpass-db
          persistentVolumeClaim:
            claimName: overpass-belarus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: overpass-belarus-svc
  namespace: diploma
spec:
  selector:
    app: overpass-belarus
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
