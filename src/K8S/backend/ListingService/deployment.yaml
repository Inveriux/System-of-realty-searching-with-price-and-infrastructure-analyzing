apiVersion: apps/v1
kind: Deployment 
metadata:
  name: listing-service-deployment
  namespace: diploma
  labels: 
    app: listing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listing-service-deployment
  template:
    metadata:
      labels:
        app: listing-service-deployment
    spec:
      containers:
        - name: listing-service
          image: diploma.listingservice:0.5
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: listing-service-config
            - secretRef:
                name: listing-service-secret
      initContainers: 
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: listing-service-svc
  namespace: diploma
spec:
  selector: 
    app: listing-service-deployment
  ports: 
    - protocol: TCP
      port: 8080