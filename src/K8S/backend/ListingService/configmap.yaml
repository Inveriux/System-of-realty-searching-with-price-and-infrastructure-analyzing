apiVersion: v1
kind: ConfigMap
metadata:
  name: listing-service-config
  namespace: diploma
data:
  SERVICE_NAME: LISTING_SERVICE
  DeleteDataAtStartup: "true"
  ASPNETCORE_URLS: http://+:8080
  ImageService__BaseUrl: http://image-service-svc:8080
  InfrastructureService__BaseUrl: http://infrastructure-service-svc:8080
  SearchService__BaseUrl: http://search-service-svc:8080
  CurrencyRate__BaseUrl: https://api.nbrb.by/
  CurrencyRate__UsdRatePath: exrates/rates/USD?parammode=2
