apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: diploma-gateway
  namespace: diploma
spec: 
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    hostname: diploma.com
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 8443
    hostname: diploma.com
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: diploma-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: diploma-route
  namespace: diploma
spec: 
  parentRefs:
    - name: diploma-gateway
  hostnames:
    - listing-service.com
    - diploma.com
  rules:
    # - matches:
    #   - path: 
    #       type: PathPrefix
    #       value: /
    #   backendRefs:
    #     - name: listing-service-svc
    #       port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: user-service-svc
          port: 8080