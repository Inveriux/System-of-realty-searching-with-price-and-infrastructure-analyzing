apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: diploma-gateway
  namespace: diploma
spec: 
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 8443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: diploma-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: diploma-route
  namespace: diploma
spec: 
  parentRefs:
    - name: diploma-gateway
  hostnames:
    - listing-service.com
    - diploma.com
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /api/images
      backendRefs:
        - name: image-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/listings
      backendRefs:
        - name: listing-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/listing-pages
      backendRefs:
        - name: listing-page-bff-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/search
      backendRefs:
        - name: search-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/pricing-analytics
      backendRefs:
        - name: pricing-analytics-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/listing_types
      - path:
          type: PathPrefix
          value: /api/building_types
      - path:
          type: PathPrefix
          value: /api/bathroom_types
      - path:
          type: PathPrefix
          value: /api/renovation_types
      - path:
          type: PathPrefix
          value: /api/building_materials
      - path:
          type: PathPrefix
          value: /api/class_types
      - path:
          type: PathPrefix
          value: /api/gas_types
      - path:
          type: PathPrefix
          value: /api/heating_types
      - path:
          type: PathPrefix
          value: /api/land_categories
      - path:
          type: PathPrefix
          value: /api/layout_types
      - path:
          type: PathPrefix
          value: /api/office_classes
      - path:
          type: PathPrefix
          value: /api/road_access_types
      - path:
          type: PathPrefix
          value: /api/sewer_types
      - path:
          type: PathPrefix
          value: /api/wall_materials
      - path:
          type: PathPrefix
          value: /api/water_supply_types
      backendRefs:
        - name: listing-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/users
      backendRefs:
        - name: user-service-svc
          port: 8080
    - matches:
      - path:
          type: PathPrefix
          value: /api/chat
      - path:
          type: PathPrefix
          value: /hubs/chat
      backendRefs:
        - name: chat-service-svc
          port: 8080
---
