apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search-service-db
  namespace: diploma
  labels:
    app: search-service-db
spec:
  serviceName: search-service-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: search-service-db
  template:
    metadata:
      labels:
        app: search-service-db
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: search-service-db-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: search-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: search-service-db-svc
  namespace: diploma
spec:
  selector:
    app: search-service-db
  ports:
    - port: 5432
  clusterIP: None
